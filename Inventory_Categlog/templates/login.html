{% extends 'base.html' %}

{% block title %}Log in · Home Inventory{% endblock %}

{% block content %}
    <div class="card login-card">
        <div class="eyebrow">Local catalog</div>
        <h1>Sign in</h1>
        <p class="meta">Use your administrator or viewer account to continue.</p>

        <form method="post">
            <div>
                <label for="username">Username</label>
                <input id="username" name="username" required autofocus autocomplete="username">
            </div>

            <div>
                <label for="password">Password</label>
                <input id="password" name="password" type="password" required autocomplete="current-password">
            </div>

            <div class="form-actions">
                <button type="submit">Log in</button>
            </div>
        </form>
    </div>
{% endblock %}
